<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tommi Haanranta</title>
    <meta name="description" content="Tommi Haanranta, ohjelmistokehittäjä." />
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root {
        --bg: #f7f5f0;
        --text: #1e1c19;
        --text-dim: #55504a;
        --accent: #8a3d16;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1917;
          --text: #ece8e1;
          --text-dim: #aaa39a;
          --accent: #e09a63;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 17px;
        line-height: 1.6;
      }
      main {
        max-width: 30rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.8rem, 6vw, 2.4rem);
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--text-dim);
      }
      a {
        color: var(--accent);
        text-underline-offset: 0.15em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tommi Haanranta</h1>
      <p>Ohjelmistokehittäjä. Laajempi esittely tulee tähän osoitteeseen.</p>
      <p><a href="mailto:no.jopas@gmail.com">no.jopas@gmail.com</a></p>
    </main>
  </body>
</html>
